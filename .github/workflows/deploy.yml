name: Deploy static content to Pages

on:
  # 當有程式碼 push 到 main 分支時觸發自動部署
  push:
    branches: ['main'] # 如果你的預設分支是 master，請將這裡改成 master

# 設定 GITHUB_TOKEN 的權限，允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保不會有多個部署任務同時進行，較新的 push 會取消舊的排程
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 打包任務
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 如果你的專案沒有 package-lock.json，請將這行改成 npm install

      - name: Build
        run: npm run build

      - name: Create 404 page for BrowserRouter
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 打包後預設會輸出到 dist 資料夾
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4